[workspace]
members = [".", "crates/streamproxy"]

[workspace.package]
edition = "2021"
version = "0.3.0"
publish = false
license = "MIT"
repository = "https://github.com/SysSteve/sysradio"

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "stream", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
log = "0.4.34"

[package]
name = "sysradio"
description = "SysRadio, a small internet radio player"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sysradio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
streamproxy = { path = "crates/streamproxy" }
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-log = "2.10.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-store = "2.5.0"
tauri-plugin-updater = "2.13.3"
tauri-plugin-window-state = "2.5.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
# Same version Tauri uses, so it is compiled once.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Variant",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
