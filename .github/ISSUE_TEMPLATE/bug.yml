name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SysRadio version
      description: Settings → About
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Windows 11 24H2 / macOS 15
    validations:
      required: true
  - type: input
    id: station
    attributes:
      label: Station (if it is about one)
      description: Name or stream URL
